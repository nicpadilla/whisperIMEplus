plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ciSigningValues = [
        System.getenv("CI_SIGNING_KEYSTORE_PATH"),
        System.getenv("CI_SIGNING_STORE_PASSWORD"),
        System.getenv("CI_SIGNING_KEY_ALIAS"),
        System.getenv("CI_SIGNING_KEY_PASSWORD")
]
def anyCiSigningValue = ciSigningValues.any { it != null && !it.trim().isEmpty() }
def ciSigningConfigured = ciSigningValues.every { it != null && !it.trim().isEmpty() }
if (anyCiSigningValue && !ciSigningConfigured) {
    throw new GradleException("CI signing configuration is incomplete")
}

android {
    namespace 'com.whisperonnx'
    compileSdk 35

    lintOptions {
        disable 'MissingTranslation'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    signingConfigs {
        if (ciSigningConfigured) {
            ci {
                storeFile file(System.getenv("CI_SIGNING_KEYSTORE_PATH"))
                storePassword System.getenv("CI_SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("CI_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("CI_SIGNING_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "org.woheller69.whisperplus"
        minSdk 28
        targetSdk 35
        versionCode 18
        versionName "1.8"
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    buildTypes {
        debug {
            if (ciSigningConfigured) signingConfig signingConfigs.ci
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'com.google.guava:guava:31.1-android'
    implementation 'com.github.gkonovalov.android-vad:webrtc:2.0.10'
    implementation 'com.github.houbb:opencc4j:1.8.1'

    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-extensions-android:0.12.4'
    implementation 'com.github.woheller69:FreeDroidWarn:1c187fcc64760832ed3edc3f96b02c5ceaf82e8a'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.mockito:mockito-core:5.8.0'
}
