name: Build and test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Reject committed signing material
        shell: bash
        run: |
          tracked="$(git ls-files '*.keystore' '*.jks')"
          if [ -n "$tracked" ]; then
            echo "::error::Signing material is tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi

      - name: Verify optional CI signing configuration
        shell: bash
        run: |
          test_key="$RUNNER_TEMP/signing-smoke-test.keystore"
          keytool -genkeypair -noprompt \
            -storetype JKS \
            -keystore "$test_key" -storepass smoke-store \
            -alias smoke-key -keypass smoke-key-pass \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=CI Signing Smoke Test, OU=CI, O=Whisper Fork, C=US"
          CI_SIGNING_KEYSTORE_PATH="$test_key" \
          CI_SIGNING_STORE_PASSWORD="smoke-store" \
          CI_SIGNING_KEY_ALIAS="smoke-key" \
          CI_SIGNING_KEY_PASSWORD="smoke-key-pass" \
            ./gradlew --stacktrace :app:validateSigningDebug
          rm -f "$test_key"

      - name: Build untrusted debug APK
        run: ./gradlew --stacktrace assembleDebug

      - name: Run unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --stacktrace lintDebug

      - name: Upload test and lint reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload untrusted debug APK
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: untrusted-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
