name: Apply fork hardening bundle

on:
  push:
    branches: [ codex/fork-hardening ]
    paths:
      - tools/fork-hardening.bundle.00

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/fork-hardening
          fetch-depth: 0

      - name: Apply reviewed implementation bundle
        run: bash tools/apply-fork-hardening-bundle.sh
