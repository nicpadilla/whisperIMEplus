name: Trusted APK

on:
  push:
    branches: [ master ]

concurrency:
  group: trusted-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trusted-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/whisper-ci-signing.keystore

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify trusted signing secrets
        shell: bash
        env:
          CI_SIGNING_KEYSTORE_BASE64: ${{ secrets.CI_SIGNING_KEYSTORE_BASE64 }}
          CI_SIGNING_STORE_PASSWORD: ${{ secrets.CI_SIGNING_STORE_PASSWORD }}
          CI_SIGNING_KEY_ALIAS: ${{ secrets.CI_SIGNING_KEY_ALIAS }}
          CI_SIGNING_KEY_PASSWORD: ${{ secrets.CI_SIGNING_KEY_PASSWORD }}
        run: |
          missing=0
          for name in CI_SIGNING_KEYSTORE_BASE64 CI_SIGNING_STORE_PASSWORD CI_SIGNING_KEY_ALIAS CI_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "See docs/ci-signing.md for setup and key-rotation details."
            exit 1
          fi

      - name: Materialize trusted signing key
        shell: bash
        env:
          CI_SIGNING_KEYSTORE_BASE64: ${{ secrets.CI_SIGNING_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$CI_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$CI_SIGNING_KEYSTORE_PATH"
          test -s "$CI_SIGNING_KEYSTORE_PATH"

      - name: Build trusted debug APK
        env:
          CI_SIGNING_STORE_PASSWORD: ${{ secrets.CI_SIGNING_STORE_PASSWORD }}
          CI_SIGNING_KEY_ALIAS: ${{ secrets.CI_SIGNING_KEY_ALIAS }}
          CI_SIGNING_KEY_PASSWORD: ${{ secrets.CI_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --stacktrace clean assembleDebug

      - name: Verify APK signature
        shell: bash
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/signature.txt
          cert_digest="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' app/build/outputs/apk/debug/signature.txt | head -1)"
          {
            echo '## Trusted APK signature'
            echo
            echo "Certificate SHA-256: \`${cert_digest:-unavailable}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trusted APK
        uses: actions/upload-artifact@v7
        with:
          name: trusted-debug-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/signature.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$CI_SIGNING_KEYSTORE_PATH"
